name: Pages

on:
  push:
    branches:
      - master # default branch

# 连续推送时跳过排队中的旧构建，但不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # 和 _config.yml 的 timezone 保持一致，否则 0~8 点发布的文章链接日期会差一天
          TZ: Asia/Shanghai
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
