<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110">
<rect width="1400" height="1110" fill="white"/>
<text x="40" y="30.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818" font-weight="600">同一页面的两种调整</text>
<text x="1360" y="30.0" dominant-baseline="central" text-anchor="end" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">预算：完整 JPEG ≤ 300,000 bytes</text>
<polyline points="700,72 700,861" fill="none" stroke="#cecece" stroke-width="1" stroke-linejoin="round"/>
<text x="40" y="88.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="25" fill="#181818" font-weight="600">① 固定尺寸，寻找可用的较高质量</text>
<text x="760" y="88.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="25" fill="#181818" font-weight="600">② 最低质量仍超限，再减小尺寸</text>
<text x="40" y="144.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">先测 q = 0.84；超限后测 q = 0.55</text>
<text x="40" y="183.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">下界合格、上界超限时，二分 7 次</text>
<polyline points="98,267 640,267" fill="none" stroke="#181818" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="98.0" cy="267.0" rx="5.0" ry="5.0" fill="#181818" stroke="#181818" stroke-width="1.5"/>
<text x="98" y="233.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="24" fill="#181818">0.55</text>
<ellipse cx="369.0" cy="267.0" rx="5.0" ry="5.0" fill="#ffffff" stroke="#181818" stroke-width="1.5"/>
<text x="369" y="233.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="24" fill="#181818" font-weight="600">0.695</text>
<ellipse cx="640.0" cy="267.0" rx="5.0" ry="5.0" fill="#ffffff" stroke="#181818" stroke-width="1.5"/>
<text x="640" y="233.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="24" fill="#181818">0.84</text>
<text x="98" y="307.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">已合格</text>
<text x="369" y="307.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">第 1 次试探</text>
<text x="640" y="307.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">超限</text>
<polyline points="369,325 369,370" fill="none" stroke="#666666" stroke-width="1.3" stroke-linejoin="round"/>
<polygon points="369,370 373.5,361.0 364.5,361.0" fill="#666666" stroke="#666666" stroke-width="0.7"/>
<text x="40" y="413.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818" font-weight="600">本次合格</text>
<polyline points="98,452 640,452" fill="none" stroke="#cecece" stroke-width="2" stroke-linejoin="round"/>
<rect x="369" y="440" width="271" height="24" rx="0" fill="#f4f4f4" stroke="#181818" stroke-width="1.1"/>
<text x="40" y="491.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">升下界，保留这次 JPEG</text>
<text x="40" y="553.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818" font-weight="600">本次超限</text>
<polyline points="98,592 640,592" fill="none" stroke="#cecece" stroke-width="2" stroke-linejoin="round"/>
<rect x="98" y="580" width="271" height="24" rx="0" fill="#f4f4f4" stroke="#181818" stroke-width="1.1"/>
<text x="40" y="631.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">降上界，继续保留此前合格结果</text>
<polyline points="40,680 650,680" fill="none" stroke="#cecece" stroke-width="1" stroke-linejoin="round"/>
<text x="40" y="721.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818" font-weight="600">q 不是文件大小：每次编码后都要实测</text>
<text x="40" y="760.38" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">7 次后区间宽约 0.00227</text>
<text x="40" y="791.62" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">采用已保存的合格结果</text>
<text x="760" y="144.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">当前尺寸在 q = 0.55 下的体积：B</text>
<rect x="768" y="220" width="147" height="196" rx="0" fill="#f4f4f4" stroke="#181818" stroke-width="1.5"/>
<rect x="788" y="244" width="107" height="66" rx="0" fill="#cecece" stroke="#cecece" stroke-width="0.8"/>
<polyline points="788,336 881,336" fill="none" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>
<polyline points="788,350 881,350" fill="none" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>
<polyline points="788,364 881,364" fill="none" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>
<text x="841" y="452.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818" font-weight="600">原渲染画布</text>
<text x="841" y="488.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">最长边 ≤ 2048</text>
<rect x="1065" y="197" width="154" height="205" rx="0" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
<text x="1237" y="211.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#666666">L0</text>
<rect x="1090" y="242" width="116" height="154" rx="0" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
<text x="1224" y="256.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#666666">L1</text>
<rect x="1118" y="288" width="79" height="105" rx="0" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
<text x="1215" y="302.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#666666">L2</text>
<polyline points="916,310 1000,310 1000,240 1064,240" fill="none" stroke="#181818" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="1064,240 1055.0,235.5 1055.0,244.5" fill="#181818" stroke="#181818" stroke-width="0.7"/>
<polyline points="1000,310 1089,310" fill="none" stroke="#181818" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="1089,310 1080.0,305.5 1080.0,314.5" fill="#181818" stroke="#181818" stroke-width="0.7"/>
<polyline points="1000,310 1000,355 1117,355" fill="none" stroke="#181818" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="1117,355 1108.0,350.5 1108.0,359.5" fill="#181818" stroke="#181818" stroke-width="0.7"/>
<text x="1190" y="459.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818" font-weight="600">候选尺寸</text>
<text x="1190" y="499.0" dominant-baseline="central" text-anchor="middle" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">始终从原画布取图</text>
<polyline points="760,552 1360,552" fill="none" stroke="#cecece" stroke-width="1" stroke-linejoin="round"/>
<text x="760" y="594.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="25" fill="#181818" font-weight="600">r = 0.94 × √(300,000 / B)</text>
<text x="760" y="638.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">限制 0.50 ≤ r ≤ 0.90</text>
<text x="760" y="682.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">新长边 = floor(当前长边 × r)</text>
<text x="760" y="739.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818" font-weight="600">尺寸只是估计：重新编码，再测字节数</text>
<text x="760" y="779.38" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">从 q = 0.84 开始下一轮</text>
<text x="760" y="810.62" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">不把上一轮 JPEG 当成输入</text>
<polyline points="40,900 1360,900" fill="none" stroke="#cecece" stroke-width="1" stroke-linejoin="round"/>
<text x="40" y="881.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818" font-weight="600">同一份六页压力输入</text>
<text x="1360" y="881.0" dominant-baseline="central" text-anchor="end" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="21" fill="#666666">生成的页面 JPG 合计</text>
<text x="40" y="965.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">调整前</text>
<rect x="162" y="948" width="1000.0" height="35" rx="0" fill="#cecece" stroke="#ffffff" stroke-width="0"/>
<text x="1186.0" y="965.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="25" fill="#181818" font-weight="600">2.40 MB</text>
<text x="40" y="1038.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">调整后</text>
<rect x="162" y="1021" width="686.5574573185863" height="35" rx="0" fill="#181818" stroke="#ffffff" stroke-width="0"/>
<text x="872.5574573185863" y="1038.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="25" fill="#181818" font-weight="600">1.65 MB</text>
</svg>