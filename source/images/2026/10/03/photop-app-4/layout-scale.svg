<text x="605" y="135.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="24" fill="#181818" font-weight="600">02  保存与换算</text>
<text x="605" y="181.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">x = 0.10   y = 0.35   w = 0.80   h = 0.50</text>
<text x="605" y="220.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">y 从内容区底部计；显示距顶 1 − y − h</text>
<rect x="605" y="249" width="755" height="127" rx="0" fill="#f4f4f4" stroke="#cecece" stroke-width="1"/>
