<text x="605" y="464.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">页高 841.92 pt，距顶 156.81 pt，框高 368.34 pt</text>
<text x="605" y="505.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">底起点 = 841.92 − 156.81 − 368.34</text>
<text x="605" y="543.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="25" fill="#181818" font-weight="600">             = 316.77 pt</text>
<text x="605" y="591.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="21" fill="#666666">位置要减去整个框高；只翻转起点会落错地方</text>
<text x="605" y="649.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="25" fill="#181818" font-weight="600">先在纸面 pt 中排字，再缩放绘制</text>
<text x="605" y="683.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="21" fill="#666666">换行与行基线沿用纸面结果，输出不重新猜行高</text>
