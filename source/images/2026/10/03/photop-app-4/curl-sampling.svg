<text x="312" y="647.1487483155918" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="21" fill="#181818">背面候选 · 150°</text>
<text x="47" y="602.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="24" fill="#181818" font-weight="600">d / r = 0.5</text>
<text x="48" y="951.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="20" fill="#666666">两点投影在同一位置；取纸界内的上层候选</text>
<text x="650" y="600.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="24" fill="#181818" font-weight="600">取 d = r/2 = 36.25 点</text>
<text x="650" y="648.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">正面：θ = asin(d/r) = 30°</text>
<text x="650" y="689.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">背面：θ = π−asin(d/r) = 150°</text>
<text x="650" y="737.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">展平后的纸面距离 s = rθ   （θ 用弧度）</text>
<text x="650" y="781.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">正面 s ≈ 37.96 点；背面 s ≈ 189.80 点</text>
<text x="650" y="831.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">纸面取色位置 = X + n·(s−d)</text>
<text x="650" y="876.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818">沿 n 位移：正面 1.71 点，背面 153.55 点</text>
<text x="650" y="927.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="21" fill="#666666">折线切向位置不变；背面候选在纸界内时优先</text>
<polyline points="40,983 1360,983" fill="none" stroke="#cecece" stroke-width="1" stroke-linejoin="round"/>
<text x="40" y="1020.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="24" fill="#181818" font-weight="600">03  正反面各有内容</text>
<text x="40" y="1064.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">向前：正面纹理取 u，背面取 1−u；反向互换。正背面取各自的实际页</text>
<text x="40" y="1105.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#666666">像素位置 → 回查纸面 → 选择正 / 背页 → 光照与投影；纸面外的部分让底页露出</text>
</svg>