<text x="285" y="431.4233989385071" dominant-baseline="central" text-anchor="end" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="20" fill="#181818">F · 卷起起始线</text>
<text x="48" y="496.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="21" fill="#666666">轨迹先向上抬，再落到左侧；鼠标输入只决定 p</text>
<text x="650" y="140.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="23" fill="#181818" font-weight="600">同一进度可用于拖动、自动翻页和视频</text>
<text x="650" y="187.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">G = (w, 0.88h)</text>
<text x="650" y="228.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">C = (w(1−2p), 0.88h−0.20h·sin(πp))</text>
<text x="650" y="280.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">本例：G = (500,616)，C = (0,476)</text>
<text x="650" y="327.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">n = (G−C) / |G−C| ≈ (0.963,0.270)</text>
<text x="650" y="373.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">r = 72.5 点；受页宽、位移和书脊余量限制</text>
<text x="650" y="428.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">F = (G+C)/2 − n·πr/2</text>
<text x="650" y="469.0" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="22" fill="#181818">输出像素 X 的投影距离：d = (X−F)·n</text>
<polyline points="40,554 1360,554" fill="none" stroke="#cecece" stroke-width="1" stroke-linejoin="round"/>
