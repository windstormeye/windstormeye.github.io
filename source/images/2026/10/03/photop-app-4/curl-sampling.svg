<text x="298.0" y="356.91999999999996" dominant-baseline="central" text-anchor="end" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="20" fill="#181818">C · 当前轨迹点</text>
<text x="422.0" y="374.32" dominant-baseline="central" text-anchor="start" font-family="Heiti SC, STHeiti, PingFang SC, sans-serif" font-size="20" fill="#181818">中点 M</text>
