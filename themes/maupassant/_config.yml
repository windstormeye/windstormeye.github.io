seo:
  twitter_id: wengpeijun ## Twitter/X 用户名，用于 twitter:creator。
  google_site_verification: ## Google Search Console 的 HTML 标记验证码（meta 标签 content 的值）。
  baidu_site_verification: ## 百度搜索资源平台的 HTML 标签验证码（baidu-site-verification 的值）。
  bing_site_verification: ## Bing Webmaster Tools 的验证码（msvalidate.01 的值）。
cf_stats: ## 每日 PV / UV 统计，数据进 PJ Studio 统一看板（https://app.pj.studio/analytics/）
  endpoint: https://app.pj.studio/api/blog/analytics/visit ## 上报地址，留空则不上报。
fancybox: true ## 点击文章图片放大查看。
toc_number: true ## 文章目录（front-matter 写 toc: true）是否带序号。
copycode: true ## 代码块右上角的一键复制按钮。

